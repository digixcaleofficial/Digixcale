<!-- GLOBAL DIGIXCALE TOAST / MODAL ALERT -->
<div id="dxGlobalAlert" class="dx-alert-modal">
    <div class="dx-alert-card">
        <!-- Close button -->
        <button class="dx-alert-close" onclick="closeAlert()">&times;</button>
        
        <!-- Glowing Icon -->
        <div class="dx-alert-icon-wrap" id="dxAlertIconWrap">
            <i id="dxAlertIcon" class="fa-solid fa-check"></i>
        </div>

        <!-- Text Content -->
        <div class="dx-alert-body">
            <h3 id="dxAlertTitle">Success!</h3>
            <p id="dxAlertMessage">Your request has been submitted successfully.</p>
        </div>

        <!-- Action Button -->
        <button class="dx-alert-btn" onclick="closeAlert()">Done</button>
    </div>
</div>
